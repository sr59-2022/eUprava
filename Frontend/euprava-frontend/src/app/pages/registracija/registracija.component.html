<form [formGroup]="registracijaForm" (ngSubmit)="submit()">

  <div class="form-control">
    <label for="ime">Ime</label>
    <input id="ime" formControlName="ime" placeholder="Unesite ime">
  </div>

  <div class="form-control">
    <label for="prezime">Prezime</label>
    <input id="prezime" formControlName="prezime" placeholder="Unesite prezime">
  </div>

  <div class="form-control">
    <label for="korisnickoIme">Korisničko ime</label>
    <input id="korisnickoIme" formControlName="korisnickoIme" placeholder="Unesite korisničko ime">
  </div>

  <div class="form-control">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" placeholder="Unesite email">
  </div>

  <div class="form-control">
    <label for="lozinka">Lozinka</label>
    <input id="lozinka" type="password" formControlName="lozinka" placeholder="Unesite lozinku">
  </div>

  <div class="form-control">
    <label for="uloga">Uloga</label>
    <select id="uloga" formControlName="uloga">
      <option value="ROLE_STUDENT">Student</option>
      <option value="ROLE_GRADJANIN">Građanin</option>
      <option value="ROLE_POSLODAVAC">Poslodavac</option>
    </select>
  </div>

  <button type="submit">Registruj se</button>
</form>
