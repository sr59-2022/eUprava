<h2>Diplomirani studenti – aktivni kandidati</h2>

<table *ngIf="studenti.length > 0">
  <thead>
  <tr>
    <th>Ime</th>
    <th>Prezime</th>
    <th>Broj indeksa</th>
    <th>Status</th>
  </tr>
  </thead>

  <tbody>
  <tr *ngFor="let s of studenti">
    <td>{{ s.ime }}</td>
    <td>{{ s.prezime }}</td>
    <td>{{ s.brojIndeksa }}</td>
    <td>
      <span style="color: green">Dostupan</span>
    </td>
  </tr>
  </tbody>
</table>

<p *ngIf="studenti.length === 0">
  Nema dostupnih diplomiranih studenata.
</p>
