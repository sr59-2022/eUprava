<div class="page">
  <div class="header">
    <h2>Predmeti (indeks)</h2>

    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn" (click)="ucitajPredmete()" [disabled]="loading">
        Osveži
      </button>
    </div>
  </div>

  <div class="card" style="margin-bottom: 12px;">
    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label>Predmet (šifra ili naziv)</label>
        <input class="input" type="text" [(ngModel)]="filter.predmet" placeholder="npr. oop / matematika" />
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label>Status</label>
        <select class="input" [(ngModel)]="filter.polozio">
          <option [ngValue]="null">Svi</option>
          <option [ngValue]="true">Položio</option>
          <option [ngValue]="false">Nije položio</option>
        </select>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn" (click)="pretrazi()" [disabled]="loading">Pretraži</button>
        <button class="btn" (click)="resetujFiltere()" [disabled]="loading">Resetuj</button>
      </div>
    </div>
  </div>

  <div class="status" *ngIf="loading">Učitavanje...</div>
  <div class="error" *ngIf="error">{{ error }}</div>

  <div class="card" *ngIf="!loading && !error">
    <table class="table" *ngIf="predmeti.length > 0; else prazno">
      <thead>
      <tr>
        <th>Predmet</th>
        <th>Šifra</th>
        <th>ESPB</th>
        <th>Ocena</th>
        <th>Status</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let p of predmeti">
        <td>{{ p.naziv }}</td>
        <td>{{ p.sifra }}</td>
        <td>{{ p.espb }}</td>
        <td class="grade">{{ p.ocena ?? '-' }}</td>
        <td>{{ p.polozio ? 'Položio' : 'Nije položio' }}</td>
      </tr>
      </tbody>
    </table>

    <ng-template #prazno>
      <div class="empty">Nema rezultata za izabrane filtere.</div>
    </ng-template>
  </div>
</div>
