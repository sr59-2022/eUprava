services:
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - euprava-net


  fakultet-service:
    build:
      context: ./fakultet-service
    container_name: fakultet-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - euprava-net
    depends_on:
      - sluzba-service

  sluzba-service:
    build:
      context: ./sluzbaZaZaposljavanje-service
    container_name: sluzba-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
    networks:
      - euprava-net

networks:
  euprava-net:
    driver: bridge
